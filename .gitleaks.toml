# Gitleaks 配置 — 豁免误报（占位/示例/公开设计值）
title = "Nexus Code gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Upstream sample values, public Datadog token, and purged proxy file"
regexes = [
  '''default_claude_max_20x''',
  '''pubbbf48e6d78dae54bceaa4acf463299bf''',
]
# proxy/glm_proxy.py 已从历史中清除，但 git object 可能残留于 server 端。
# Key 已作废轮换。该路径的 finding 一律豁免。
paths = [
  '''proxy/glm_proxy\.py''',
]
